name: Social native PostgreSQL verification
on:
  push:
    branches: [codex/social-native-20261024]
    paths:
      - '.github/workflows/social-native.yml'
      - 'supabase/tests/social/**'
      - 'supabase/migrations-pending/20261013221627_social_v2_prepared.sql'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select PostgreSQL 17
        shell: bash
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-17
          fi
          test -x /usr/lib/postgresql/17/bin/initdb
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Record test runtime
        run: node --version && postgres --version && id -u
      - name: Native SQL and concurrent sessions
        run: npm run test:social:native
